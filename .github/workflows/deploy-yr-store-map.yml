name: Deploy YR Store Map

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight at a time; a newer push supersedes an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Deploy gate: a broken parseCSV/sanitizer/cache-fallback never reaches
      # production. If this step fails, the job stops here — no artifact is
      # built and nothing deploys.
      - name: Run tests
        run: npm test

      # Deploy only the shipped static site — never node_modules, tests, or
      # the data/ setup docs (SETUP.md, seed CSVs, the Apps Script snippet).
      - name: Prepare deploy artifact
        run: |
          mkdir -p dist
          cp index.html logic.js style.css dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
