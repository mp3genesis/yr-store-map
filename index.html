<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yves Rocher — Belgium &amp; Luxembourg Stores</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Yves Rocher — Belgium &amp; Luxembourg Stores</h1>
  </header>

  <div id="banner" class="banner" hidden></div>

  <div id="map"></div>

  <aside id="info-panel" hidden>
    <button id="info-close" aria-label="Close">&times;</button>
    <div id="info-content"></div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""
    onerror="window.__scriptLoadFailed = true"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
    onerror="window.__scriptLoadFailed = true"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"
    onerror="window.__scriptLoadFailed = true"></script>

  <script type="module">
    import {
      parseCSVText,
      parseTiersCSVText,
      saveCache,
      loadCache,
      hasValue,
      getProfitabilityColor,
      DEFAULT_PROFITABILITY_TIERS,
    } from './logic.js';

    // Published "Ops" sheet CSV — see data/SETUP.md for how this is generated.
    const OPS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRzTnVl6qH23BclFeT_Uv32xbLliGlNLHn-o4fE3s5MTCy7ZbILXmDKr_G3QvJftSMWjfEJ7bhp8Cxl/pub?gid=469869102&single=true&output=csv';

    // Published "ProfitabilityTiers" sheet CSV — lets the thresholds and
    // colors be changed from the Sheet without touching code. If this ever
    // fails to fetch, the map falls back to DEFAULT_PROFITABILITY_TIERS,
    // which is fine — this is cosmetic, not a load-bearing failure mode
    // like the ops data is.
    const PROFITABILITY_TIERS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRzTnVl6qH23BclFeT_Uv32xbLliGlNLHn-o4fE3s5MTCy7ZbILXmDKr_G3QvJftSMWjfEJ7bhp8Cxl/pub?gid=892996556&single=true&output=csv';

    const banner = document.getElementById('banner');
    const mapEl = document.getElementById('map');
    const infoPanel = document.getElementById('info-panel');
    const infoContent = document.getElementById('info-content');
    const infoClose = document.getElementById('info-close');

    infoClose.addEventListener('click', () => {
      infoPanel.hidden = true;
    });

    function showBanner(message, kind) {
      banner.textContent = message;
      banner.className = 'banner banner--' + kind;
      banner.hidden = false;
    }

    function hideBanner() {
      banner.hidden = true;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function fieldRow(label, value) {
      // Reuses the same hasValue() the Vitest suite verifies against empty
      // string / whitespace-only / missing key — this is the exact rendering
      // path the outside-voice review flagged as untested at the UI layer.
      if (!hasValue(value)) return '';
      return `<div class="info-row"><span class="info-label">${label}</span><span class="info-value">${escapeHtml(value)}</span></div>`;
    }

    // Explicit 'fr-BE' locale (not the visitor's browser default) so this
    // always renders as Belgian/French euro formatting — "778 954 €" — not
    // whatever locale the person viewing the map happens to have set.
    function formatEUR(value) {
      if (value === null || value === undefined) return null;
      return value.toLocaleString('fr-BE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
    }

    function formatSqm(value) {
      if (value === null || value === undefined) return null;
      return `${value.toLocaleString('fr-BE')} m²`;
    }

    function showStoreInfo(store) {
      const profitability = store.profitabilityPct !== null ? `${store.profitabilityPct}%` : null;
      infoContent.innerHTML = `
        <h2>${escapeHtml(store.name || store.code)}</h2>
        ${fieldRow('Address', store.address)}
        ${fieldRow('Hours', store.hours)}
        ${fieldRow('Phone', store.phone)}
        ${fieldRow('Manager contact', store.managerContact)}
        ${fieldRow('Area Manager', store.areaManager)}
        ${fieldRow('Ownership type', store.ownershipType)}
        ${fieldRow('Partner', store.partnerName)}
        ${fieldRow('Format', store.formatType)}
        ${fieldRow('Surface', formatSqm(store.surfaceSqm))}
        ${fieldRow('Province', store.province)}
        ${fieldRow('Profitability', profitability)}
        ${fieldRow('Turnover 2025', formatEUR(store.ca2025))}
        ${fieldRow('Turnover 2026 (target)', formatEUR(store.ca2026Target))}
        ${fieldRow('Turnover 2026 (actual)', formatEUR(store.ca2026Actual))}
        ${fieldRow('Turnover 2027 (target)', formatEUR(store.ca2027Target))}
        ${fieldRow('Turnover 2027 (actual)', formatEUR(store.ca2027Actual))}
      `;
      infoPanel.hidden = false;
    }

    // Starts as the hardcoded defaults; fetchProfitabilityTiers() replaces
    // it wholesale if the published ProfitabilityTiers sheet parses with at
    // least one valid tier. Colors/thresholds are cosmetic, so a fetch
    // failure here degrades gracefully instead of blocking the map like the
    // ops-data fetch does.
    let profitabilityTiers = DEFAULT_PROFITABILITY_TIERS;

    async function fetchProfitabilityTiers() {
      if (!PROFITABILITY_TIERS_URL || PROFITABILITY_TIERS_URL.startsWith('PLACEHOLDER')) {
        return; // sheet not set up yet — keep defaults, no error needed
      }
      try {
        const response = await fetch(PROFITABILITY_TIERS_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const csvText = await response.text();
        const { tiers, skipped } = parseTiersCSVText(csvText);
        if (skipped.length) console.warn('Skipped rows while parsing profitability tiers:', skipped);
        if (tiers.length) profitabilityTiers = tiers; // keep defaults if the sheet had nothing valid
      } catch (err) {
        console.warn('Failed to fetch profitability tiers, using defaults:', err);
      }
    }

    let map;
    let clusterGroup;

    function initMapIfNeeded() {
      if (map) return;
      map = L.map('map').setView([50.6, 4.9], 8); // rough BE/LU center
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19,
      }).addTo(map);
      clusterGroup = L.markerClusterGroup();
      map.addLayer(clusterGroup);
    }

    function renderMap(stores) {
      initMapIfNeeded();
      clusterGroup.clearLayers();
      for (const store of stores) {
        const color = getProfitabilityColor(store.profitabilityPct, profitabilityTiers);
        const marker = L.circleMarker([store.lat, store.long], {
          radius: 8,
          color: '#222',
          weight: 1,
          fillColor: color,
          fillOpacity: 0.9,
        });
        marker.bindTooltip(store.name || store.code);
        marker.on('click', () => showStoreInfo(store));
        clusterGroup.addLayer(marker);
      }
    }

    function latestUpdatedAt(stores) {
      let latest = null;
      for (const s of stores) {
        if (!s.updatedAt) continue;
        const d = new Date(s.updatedAt);
        if (isNaN(d.getTime())) continue;
        if (!latest || d > latest) latest = d;
      }
      return latest;
    }

    function formatTimestamp(iso) {
      if (!iso) return 'an unknown time';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return 'an unknown time';
      return d.toLocaleString();
    }

    async function fetchOpsData() {
      try {
        const response = await fetch(OPS_CSV_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const csvText = await response.text();
        const { stores, skipped } = parseCSVText(csvText);
        if (skipped.length) console.warn('Skipped rows while parsing ops data:', skipped);

        const updatedAt = latestUpdatedAt(stores);
        saveCache(stores, updatedAt ? updatedAt.toISOString() : null);

        renderMap(stores);
        hideBanner();
      } catch (err) {
        console.error('Failed to fetch live store data:', err);
        const cached = loadCache();
        if (cached && cached.stores && cached.stores.length) {
          renderMap(cached.stores);
          const asOf = cached.updatedAt || cached.cachedAt;
          showBanner(`Data may be outdated — showing data as of ${formatTimestamp(asOf)}.`, 'stale');
        } else {
          showBanner("Couldn't load store data — try refreshing the page.", 'error');
        }
      }
    }

    async function boot() {
      const leafletOk = typeof L !== 'undefined' && typeof L.markerClusterGroup === 'function';
      const papaOk = typeof Papa !== 'undefined';
      if (window.__scriptLoadFailed || !leafletOk || !papaOk) {
        mapEl.innerHTML = '';
        showBanner('Map failed to load — check your connection (or disable content blockers for this page), then refresh.', 'error');
        return;
      }
      await fetchProfitabilityTiers(); // best-effort, never blocks on failure
      fetchOpsData();
    }

    boot();
  </script>
</body>
</html>
